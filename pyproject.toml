[project]
name = "job-scanner"
version = "0.1.0"
description = "Daily scanner for remote jobs open to candidates working from Thailand"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanner*"]
